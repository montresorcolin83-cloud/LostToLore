<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LostToLore Links</title>
  <style>
    /* === Customizable Variables === */
    :root {
      --bg-color: #0f0f0f;
      --text-color: #ffffff;
      --button-bg: #1a1a1a;
      --button-hover: #333333;
      --font: Arial, sans-serif;
      --title-size: 2.2rem;
      --button-radius: 12px;
    }

    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 400px;
      width: 90%;
    }
    h1 {
      font-size: var(--title-size);
      margin-bottom: 20px;
    }
    .link-btn {
      display: block;
      background: var(--button-bg);
      padding: 15px;
      margin: 12px 0;
      border-radius: var(--button-radius);
      text-decoration: none;
      color: var(--text-color);
      font-size: 1.1rem;
      transition: 0.2s;
    }
    .link-btn:hover {
      background: var(--button-hover);
    }

    /* === Optional custom background image === */
    /* Uncomment and replace URL to add an image background */
    /* body {
        background: url('your-image.jpg') no-repeat center center/cover;
    } */
  </style>
</head>
<body>
  <div class="container">
    <h1>LostToLore</h1>
    <a class="link-btn" href="https://www.tiktok.com/@losttolore?_r=1&_t=ZN-91fIM0o7Dte" target="_blank">TikTok</a>
    <a class="link-btn" href="https://www.instagram.com/losttolore?igsh=MTRxZTRmNnd1dGpvdQ==" target="_blank">Instagram</a>
      <!-- Add more links below by copying one line -->
    <!-- Example: <a class="link-btn" href="YOUR LINK" target="_blank">Your Platform</a> -->

  </div>
</body>
</html>
